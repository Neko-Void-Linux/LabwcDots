# window border
window.active.border.color: #cdca75
window.inactive.border.color: #cbc8a4

# ToggleKeybinds status indicator
window.active.indicator.toggled-keybind.color: #ffb4ab

# window titlebar background
window.active.title.bg.color: #cdca75
window.inactive.title.bg.color: #cbc8a4

window.active.label.text.color: #333200
window.inactive.label.text.color: #323218
window.label.text.justify: center

# window button hover overlay
window.button.hover.bg.color: #2b2a22

# window buttons
window.active.button.unpressed.image.color: #333200
window.inactive.button.unpressed.image.color: #333200

# menu
menu.border.color: #333200
menu.items.bg.color: #cdca75
menu.items.text.color: #333200
menu.items.active.bg.color: #cbc8a4
menu.items.active.text.color: #323218
menu.separator.color: #333200
menu.title.bg.color: #cdca75
menu.title.text.color: #333200

# on screen display (window-cycle dialog)
osd.bg.color: #cdca75
osd.border.color: #333200
osd.label.text.color: #333200
osd.window-switcher.preview.border.color: #939181
